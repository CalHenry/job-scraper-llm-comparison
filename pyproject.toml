[project]
authors = [{name = "Calixte Henry", email = "131826512+CalHenry@users.noreply.github.com"}]
name = "ai_scrapper_jobmarket"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = [ "crawl4ai>=0.7.4,<0.8", "nest-asyncio>=1.6.0,<2", "langchain-ollama>=0.3.6,<0.4", "curl-cffi>=0.13.0,<0.14"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
