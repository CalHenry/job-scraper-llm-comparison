[project]
authors = [
    { name = "Calixte Henry", email = "131826512+CalHenry@users.noreply.github.com" },
]
name = "ai_scrapper_jobmarket"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = [
    "crawl4ai>=0.7.4,<0.8",
    "nest-asyncio>=1.6.0,<2",
    "langchain-ollama>=0.3.6,<0.4",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel] # so src is recognized as a package
packages = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
ai_scrapper_jobmarket = { path = ".", editable = true }

[tool.pixi.tasks]
create_virtual_env = "pixi install"
create_data_folder = { cmd = [
    "bash",
    "-c",
    "mkdir -p data/{compare_results,processed/{csv,json/llm_output},raw/{links,scraped_pages}}",
] }
crawl4ai = "crawl4ai-setup"

setup = { depends-on = [
    "create_virtual_env",
    "create_data_folder",
    "crawl4ai",
] }

script_01 = "pixi run python scripts/01_extract_job_offers_links.py"
script_02 = "pixi run python scripts/02_extract_job_offers_content.py"
script_03 = "pixi run python scripts/03_process_with_LLM.py"
script_04 = "pixi run python scripts/04_process_with_polars.py"
script_05 = "pixi run python scripts/05_extract_job_offers_APEC.py"

[tool.pixi.dependencies]
polars = ">=1.32.3,<2"
langchain-core = ">=0.3.74,<0.4"
langchain = ">=0.3.27,<0.4"
cssselect = ">=1.3.0,<2"
